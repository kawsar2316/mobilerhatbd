<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Details - Mobile BD</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f1f5f9}</style></head><body>
<header class="bg-white sticky top-0 z-40 border-b"><div class="max-w-3xl mx-auto px-3 py-2.5 flex justify-between items-center"><a href="/" class="text-xl font-extrabold text-blue-600">Mobile BD</a><a href="/" class="text-xs bg-gray-100 px-3 py-1 rounded-full">Home</a></div></header>
<div id="wrap" class="max-w-3xl mx-auto px-2 py-3"><div class="bg-white rounded-2xl border p-3 text-center">Loading...</div></div>
<script>
const NPOINT="https://api.npoint.io/cd45816ccf83cda565d1";
function getV(o,k){for(let x of k){if(o[x]!==undefined&&o[x]!==null&&String(o[x]).trim()!=='') return o[x];}return '';}
function fixLink(l){if(!l) return '';l=l.trim();if(l.startsWith('http://')||l.startsWith('https://')) return l;return 'https://'+l;}
async function load(){
 let id=new URLSearchParams(location.search).get('id');
 let r=await fetch(NPOINT); let phones=await r.json();
 let p=phones.find(x=>String(x.id)==String(id));
 if(!p){document.getElementById('wrap').innerHTML='Phone not found';return;}
 let name=getV(p,['name'])||'';let price=getV(p,['price','a_price'])||'';let img=getV(p,['image','img'])||'';let ram=getV(p,['ram'])||'-';let rom=getV(p,['rom'])||'-';let display=getV(p,['display'])||'-';let proc=getV(p,['processor','chipset','cpu'])||'-';let battery=getV(p,['battery'])||'-';let status=getV(p,['status'])||'';let camera=getV(p,['camera','cam'])||'-';let body=getV(p,['body'])||'-';let color=getV(p,['color'])||'-';let os=getV(p,['os','android'])||'-';let extra=getV(p,['full_text','extra'])||'-';let buy=fixLink(getV(p,['affiliate','link']));
 document.getElementById('wrap').innerHTML=`<div class="bg-white rounded-2xl border shadow-sm overflow-hidden"><div class="p-4 flex justify-center bg-gray-50"><img src="${img}" class="w-full max-w-[280px] h-[280px] object-contain"></div><div class="p-4"><h1 class="text-xl font-bold">${name}</h1><p class="text-blue-600 font-extrabold text-xl mt-1">TK ${price}</p><p class="text-gray-500 text-xs mt-1">${status} | ${getV(p,['brand'])||''}</p><div class="grid grid-cols-2 gap-2 mt-4"><div class="bg-gray-50 border rounded-xl p-3"><b>RAM:</b> ${ram}</div><div class="bg-gray-50 border rounded-xl p-3"><b>ROM:</b> ${rom}</div><div class="bg-gray-50 border rounded-xl p-3"><b>Display:</b> ${display}</div><div class="bg-gray-50 border rounded-xl p-3"><b>Processor:</b> ${proc}</div><div class="bg-gray-50 border rounded-xl p-3 col-span-2"><b>Camera:</b> ${camera}</div><div class="bg-gray-50 border rounded-xl p-3"><b>Battery:</b> ${battery}</div><div class="bg-gray-50 border rounded-xl p-3"><b>OS:</b> ${os}</div><div class="bg-gray-50 border rounded-xl p-3"><b>Body:</b> ${body}</div><div class="bg-gray-50 border rounded-xl p-3"><b>Color:</b> ${color}</div></div><div class="mt-4 border rounded-xl p-3"><b>Full Description:</b><p class="text-sm text-gray-600 mt-1 whitespace-pre-wrap">${extra}</p></div>${buy?`<a href="${buy}" target="_blank" class="block mt-4 bg-green-600 text-white text-center py-3 rounded-xl font-bold">Buy Now - Best Price</a>`:''}<a href="/" class="block mt-2 border text-center py-3 rounded-xl font-bold">← Back to All Mobiles</a></div></div>`;
} load();
</script></body></html>
