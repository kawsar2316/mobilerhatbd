<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Details</title><style>body{margin:0;font-family:Arial;background:#f2f4f8}.box{background:#fff;max-width:700px;margin:10px auto;padding:15px;border-radius:12px}img{width:100%;max-height:400px;object-fit:contain}table{width:100%;border-collapse:collapse;margin-top:10px}td{padding:10px;border:1px solid #eee}td:first-child{font-weight:bold;background:#f9f9f9;width:35%}</style></head><body><div class="box" id="main">Loading...</div>
<script>
const NPOINT='https://api.npoint.io/cd45816ccf83cda565d1';
function getV(o,k){for(let x of k){if(o[x]!==undefined&&o[x]!==null&&String(o[x]).trim()!=='') return o[x];}return '-';}
async function init(){let id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('main').innerHTML='No ID';return;}try{let r=await fetch(NPOINT);let d=await r.json();let p=d.find(x=>String(x.id)==String(id));if(!p){document.getElementById('main').innerHTML='Not Found';return;}
document.title=p.name+' Price in Bangladesh';
document.getElementById('main').innerHTML=`
<img src="${getV(p,['image','img'])}"><h2>${p.name}</h2><h3 style="color:green">TK ${p.price}</h3>
<table>
<tr><td>Brand</td><td>${getV(p,['brand'])}</td></tr>
<tr><td>Status</td><td>${getV(p,['status'])}</td></tr>
<tr><td>Network</td><td>${getV(p,['network'])}</td></tr>
<tr><td>Release Date</td><td>${getV(p,['release','release_date'])}</td></tr>
<tr><td>RAM</td><td>${getV(p,['ram'])}</td></tr>
<tr><td>ROM</td><td>${getV(p,['rom'])}</td></tr>
<tr><td>Battery</td><td>${getV(p,['battery'])}</td></tr>
<tr><td>Weight</td><td>${getV(p,['weight'])}</td></tr>
<tr><td>Camera</td><td>${getV(p,['camera','cam'])}</td></tr>
<tr><td>Display</td><td>${getV(p,['display'])}</td></tr>
<tr><td>Processor</td><td>${getV(p,['processor'])}</td></tr>
<tr><td>Body</td><td>${getV(p,['body'])}</td></tr>
<tr><td>Color</td><td>${getV(p,['color'])}</td></tr>
<tr><td>OS</td><td>${getV(p,['os'])}</td></tr>
</table>
<div style="margin-top:15px"><b>Full Description:</b><p>${getV(p,['full_text','extra'])}</p></div>
${p.affiliate?`<a href="${p.affiliate}" target="_blank" style="display:block;background:#0a84ff;color:#fff;text-align:center;padding:12px;border-radius:8px;margin-top:15px;text-decoration:none">Buy Now</a>`:''}
`;
}catch(e){document.getElementById('main').innerHTML='Error';}}
init();
</script></body></html>
